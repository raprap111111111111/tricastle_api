name: Keep Render Alive

on:
  schedule:
    # Runs every 12 minutes to prevent Render from sleeping
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://tricastle-api.onrender.com/api/v1/health)
          echo "$response"